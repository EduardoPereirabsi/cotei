apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-avaliacao
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-avaliacao
  template:
    metadata:
      labels:
        app: mongo-avaliacao
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-avaliacao
spec:
  selector:
    app: mongo-avaliacao
  ports:
    - port: 27017
      targetPort: 27017
