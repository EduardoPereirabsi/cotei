# ms-avaliacao: avaliacoes de produtos (TypeScript / Express / MongoDB).
# REST: consulta o ms-produto para validar o produto de cada avaliacao.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-avaliacao
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-avaliacao
  template:
    metadata:
      labels:
        app: ms-avaliacao
    spec:
      containers:
        - name: ms-avaliacao
          image: eduardo1112/ms-avaliacao:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_URL
              value: mongodb://mongo-avaliacao:27017/avaliacaodb
            - name: PRODUTO_URL
              value: http://ms-produto:8080/produto
          readinessProbe:
            httpGet:
              path: /avaliacao/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-avaliacao
spec:
  selector:
    app: ms-avaliacao
  ports:
    - port: 8080
      targetPort: 8080
