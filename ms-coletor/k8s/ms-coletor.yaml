# ms-coletor: coleta ofertas e publica oferta.atualizada (Python / FastAPI / RabbitMQ).
# Nao tem banco: nao guarda estado, so coleta e publica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-coletor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-coletor
  template:
    metadata:
      labels:
        app: ms-coletor
    spec:
      containers:
        - name: ms-coletor
          image: ms-coletor:0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: {name: rabbitmq-auth, key: username}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: {name: rabbitmq-auth, key: password}
            - name: PRODUTO_URL
              value: http://ms-produto:8080/produto
          readinessProbe:
            httpGet:
              path: /coletor/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-coletor
spec:
  selector:
    app: ms-coletor
  ports:
    - port: 8080
      targetPort: 8080
