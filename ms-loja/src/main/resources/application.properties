spring.application.name=ms-loja
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lojadb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:cotei}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:cotei-lab}
# mensagem que falha no processamento nao volta para a fila (evita laco infinito)
spring.rabbitmq.listener.simple.default-requeue-rejected=false

cotei.produto.url=${PRODUTO_URL:http://ms-produto:8080/produto}
