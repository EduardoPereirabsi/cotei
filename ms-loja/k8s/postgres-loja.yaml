apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-loja
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-loja
  template:
    metadata:
      labels:
        app: postgres-loja
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: lojadb
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "lojadb"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-loja
spec:
  selector:
    app: postgres-loja
  ports:
    - port: 5432
      targetPort: 5432
