# ms-loja: lojas parceiras e ofertas (Java / Spring Boot / PostgreSQL).
# REST:     consulta o ms-produto para validar o produto de cada oferta.
# RabbitMQ: consome oferta.atualizada (fila loja.oferta-atualizada).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-loja
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-loja
  template:
    metadata:
      labels:
        app: ms-loja
    spec:
      containers:
        - name: ms-loja
          image: ms-loja:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: /loja
            - name: DB_HOST
              value: postgres-loja
            - name: DB_NAME
              value: lojadb
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              value: postgres
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: {name: rabbitmq-auth, key: username}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: {name: rabbitmq-auth, key: password}
            - name: PRODUTO_URL
              value: http://ms-produto:8080/produto
          readinessProbe:
            httpGet:
              path: /loja/ofertas
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ms-loja
spec:
  selector:
    app: ms-loja
  ports:
    - port: 8080
      targetPort: 8080
