# Sem rewrite: cada servico ja responde sob o proprio prefixo (context path).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cotei-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /produto
            pathType: Prefix
            backend:
              service:
                name: ms-produto
                port: {number: 8080}
          - path: /loja
            pathType: Prefix
            backend:
              service:
                name: ms-loja
                port: {number: 8080}
          - path: /coletor
            pathType: Prefix
            backend:
              service:
                name: ms-coletor
                port: {number: 8080}
          - path: /avaliacao
            pathType: Prefix
            backend:
              service:
                name: ms-avaliacao
                port: {number: 8080}
          - path: /alerta
            pathType: Prefix
            backend:
              service:
                name: ms-alerta
                port: {number: 8080}
